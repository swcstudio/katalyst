[package]
name = "katalyst_nif"
version = "0.1.0"
authors = []
edition = "2021"

[lib]
name = "katalyst_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

# No more PyO3 - using subprocess bridge instead

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for session management
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"
once_cell = "1.20"
