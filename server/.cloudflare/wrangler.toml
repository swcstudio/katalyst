# Katalyst Server - Cloudflare Data & Backend Services
# Optimized for Fly.io deployment with persistent data and heavy processing

name = "katalyst-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "experimental_wasm_modules"]

# Account settings
account_id = "${CLOUDFLARE_ACCOUNT_ID}"
workers_dev = true

# ============================================================================
# D1 Databases - Primary Data Storage (Heavy Backend Focus)
# ============================================================================

# Main application database
[[d1_databases]]
binding = "DB_MAIN"
database_name = "katalyst-server-main"
database_id = "your-main-db-id"
preview_database_id = "your-main-preview-db-id"
migrations_dir = "migrations/main"

# Time-series metrics database
[[d1_databases]]
binding = "DB_TIMESERIES"
database_name = "katalyst-server-timeseries"
database_id = "your-timeseries-db-id"
preview_database_id = "your-timeseries-preview-db-id"
migrations_dir = "migrations/timeseries"

# Analytics and reporting
[[d1_databases]]
binding = "DB_ANALYTICS"
database_name = "katalyst-server-analytics"
database_id = "your-analytics-db-id"
preview_database_id = "your-analytics-preview-db-id"
migrations_dir = "migrations/analytics"

# Audit logs and compliance
[[d1_databases]]
binding = "DB_AUDIT"
database_name = "katalyst-server-audit"
database_id = "your-audit-db-id"
preview_database_id = "your-audit-preview-db-id"
migrations_dir = "migrations/audit"

# ============================================================================
# Hyperdrive - Database Connection Pooling (Fly.io PostgreSQL)
# ============================================================================

# Primary Fly.io PostgreSQL connection
[[hyperdrive]]
binding = "HYPERDRIVE_FLY_PG"
id = "your-fly-pg-hyperdrive-id"
connectionString = "${FLY_POSTGRES_URL}"

# Read replica connection
[[hyperdrive]]
binding = "HYPERDRIVE_FLY_REPLICA"
id = "your-fly-replica-hyperdrive-id"
connectionString = "${FLY_POSTGRES_REPLICA_URL}"

# ============================================================================
# Vectorize - Data Embeddings & Search
# ============================================================================

# Document search index
[[vectorize]]
binding = "VECTOR_DOCUMENTS"
index_name = "katalyst-server-documents"
dimensions = 1536
metric = "cosine"

# User behavior embeddings
[[vectorize]]
binding = "VECTOR_BEHAVIOR"
index_name = "katalyst-server-behavior"
dimensions = 768
metric = "euclidean"

# Product/content recommendations
[[vectorize]]
binding = "VECTOR_RECOMMENDATIONS"
index_name = "katalyst-server-recommendations"
dimensions = 512
metric = "cosine"

# ============================================================================
# KV Namespaces - High-Performance Caching Layer
# ============================================================================

# Database query cache
[[kv_namespaces]]
binding = "KV_DB_CACHE"
id = "your-db-cache-kv-id"
preview_id = "your-db-cache-preview-kv-id"

# API response cache
[[kv_namespaces]]
binding = "KV_API_CACHE"
id = "your-api-cache-kv-id"
preview_id = "your-api-cache-preview-kv-id"

# Session storage
[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "your-sessions-kv-id"
preview_id = "your-sessions-preview-kv-id"

# Rate limiting counters
[[kv_namespaces]]
binding = "KV_RATE_LIMITS"
id = "your-rate-limits-kv-id"
preview_id = "your-rate-limits-preview-kv-id"

# Distributed locks
[[kv_namespaces]]
binding = "KV_LOCKS"
id = "your-locks-kv-id"
preview_id = "your-locks-preview-kv-id"

# ============================================================================
# Queues - Message Processing & Event Streaming
# ============================================================================

# Main event bus
[[queues.producers]]
binding = "QUEUE_EVENTS"
queue = "katalyst-server-events"

# Background jobs
[[queues.producers]]
binding = "QUEUE_JOBS"
queue = "katalyst-server-jobs"

# Data pipeline
[[queues.producers]]
binding = "QUEUE_PIPELINE"
queue = "katalyst-server-pipeline"

# Notifications
[[queues.producers]]
binding = "QUEUE_NOTIFICATIONS"
queue = "katalyst-server-notifications"

# Dead letter queue
[[queues.producers]]
binding = "QUEUE_DLQ"
queue = "katalyst-server-dlq"

# Queue consumers with heavy processing
[[queues.consumers]]
queue = "katalyst-server-events"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "katalyst-server-dlq"

[[queues.consumers]]
queue = "katalyst-server-jobs"
max_batch_size = 10
max_batch_timeout = 300  # 5 minutes for heavy jobs
max_retries = 5
dead_letter_queue = "katalyst-server-dlq"

[[queues.consumers]]
queue = "katalyst-server-pipeline"
max_batch_size = 500
max_batch_timeout = 60
max_retries = 2
dead_letter_queue = "katalyst-server-dlq"

# ============================================================================
# R2 Storage - Large File Storage & Backups
# ============================================================================

# Database backups
[[r2_buckets]]
binding = "R2_BACKUPS"
bucket_name = "katalyst-server-backups"
preview_bucket_name = "katalyst-server-backups-preview"

# File uploads
[[r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "katalyst-server-uploads"
preview_bucket_name = "katalyst-server-uploads-preview"

# Data exports
[[r2_buckets]]
binding = "R2_EXPORTS"
bucket_name = "katalyst-server-exports"
preview_bucket_name = "katalyst-server-exports-preview"

# Logs archive
[[r2_buckets]]
binding = "R2_LOGS"
bucket_name = "katalyst-server-logs"
preview_bucket_name = "katalyst-server-logs-preview"

# ============================================================================
# Durable Objects - Stateful Backend Services
# ============================================================================

# WebSocket connection manager for Phoenix channels
[[durable_objects.bindings]]
name = "WEBSOCKET_MANAGER"
class_name = "WebSocketManager"
script_name = "katalyst-server"

# Distributed state coordinator
[[durable_objects.bindings]]
name = "STATE_COORDINATOR"
class_name = "StateCoordinator"
script_name = "katalyst-server"

# Rate limiter
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "katalyst-server"

# Job scheduler
[[durable_objects.bindings]]
name = "JOB_SCHEDULER"
class_name = "JobScheduler"
script_name = "katalyst-server"

# ============================================================================
# Analytics Engine - Metrics & Monitoring
# ============================================================================

[[analytics_engine_datasets]]
binding = "ANALYTICS_API"
dataset = "katalyst_server_api_metrics"

[[analytics_engine_datasets]]
binding = "ANALYTICS_PERFORMANCE"
dataset = "katalyst_server_performance"

# ============================================================================
# Service Bindings - Connect to katalyst-core
# ============================================================================

[[services]]
binding = "CORE_AI_SERVICE"
service = "katalyst-core"
environment = "production"

# ============================================================================
# Email Routing - System Notifications
# ============================================================================

[[send_email]]
binding = "EMAIL_SYSTEM"
destination_address = "system@katalyst.io"

[[send_email]]
binding = "EMAIL_ALERTS"
destination_address = "alerts@katalyst.io"

# ============================================================================
# WASM Modules - Data Processing
# ============================================================================

[[wasm_modules]]
source = "./wasm/data_processor.wasm"
binding = "WASM_DATA_PROCESSOR"

[[wasm_modules]]
source = "./wasm/crypto.wasm"
binding = "WASM_CRYPTO"

[[wasm_modules]]
source = "./wasm/compression.wasm"
binding = "WASM_COMPRESSION"

# ============================================================================
# Environment Configurations
# ============================================================================

[env.production]
name = "katalyst-server-prod"
routes = [
  { pattern = "api.katalyst.io/*", zone_name = "katalyst.io" },
  { pattern = "data.katalyst.io/*", zone_name = "katalyst.io" }
]
vars = { 
  ENVIRONMENT = "production",
  FLY_APP_NAME = "katalyst-server",
  FLY_REGION = "${FLY_REGION}",
  FLY_POSTGRES_URL = "${DATABASE_URL}",
  PHOENIX_SECRET_KEY = "${SECRET_KEY_BASE}",
  LOG_LEVEL = "warn",
  CACHE_TTL = "3600",
  MAX_CONNECTIONS = "100"
}

[env.staging]
name = "katalyst-server-staging"
routes = [
  { pattern = "staging-api.katalyst.io/*", zone_name = "katalyst.io" }
]
vars = { 
  ENVIRONMENT = "staging",
  FLY_APP_NAME = "katalyst-server-staging",
  FLY_REGION = "${FLY_REGION}",
  FLY_POSTGRES_URL = "${DATABASE_URL}",
  PHOENIX_SECRET_KEY = "${SECRET_KEY_BASE}",
  LOG_LEVEL = "info",
  CACHE_TTL = "300",
  MAX_CONNECTIONS = "50"
}

[env.development]
name = "katalyst-server-dev"
vars = { 
  ENVIRONMENT = "development",
  FLY_APP_NAME = "katalyst-server-dev",
  FLY_REGION = "local",
  FLY_POSTGRES_URL = "postgres://localhost:5432/katalyst_dev",
  PHOENIX_SECRET_KEY = "dev-secret-key",
  LOG_LEVEL = "debug",
  CACHE_TTL = "0",
  MAX_CONNECTIONS = "10"
}

# ============================================================================
# Build Configuration
# ============================================================================

[build]
command = "npm run build:backend"
cwd = ".cloudflare"
watch_paths = ["src/**/*.ts", "wasm/**/*.wasm", "migrations/**/*.sql"]

[build.upload]
format = "modules"
main = "./dist/index.mjs"

[[build.upload.rules]]
type = "ESModule"
globs = ["**/*.js", "**/*.mjs"]

[[build.upload.rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# ============================================================================
# Observability & Monitoring
# ============================================================================

[observability]
enabled = true
head_sampling_rate = 0.05  # Lower sampling for high-volume backend

[[tail_consumers]]
service = "katalyst-server-logger"

# ============================================================================
# Performance Configuration
# ============================================================================

[limits]
cpu_ms = 50      # Standard CPU for backend operations
memory_mb = 128  # Standard memory

[placement]
mode = "smart"

# ============================================================================
# Cron Triggers - Backend Jobs
# ============================================================================

[triggers]
crons = [
  "*/5 * * * *",    # Health checks every 5 minutes
  "0 * * * *",      # Hourly data aggregation
  "0 */6 * * *",    # Database optimization every 6 hours
  "0 0 * * *",      # Daily backups
  "0 2 * * 0",      # Weekly maintenance Sunday 2 AM
  "0 3 * * *"       # Daily cleanup tasks
]

# ============================================================================
# Migrations Configuration
# ============================================================================

[[migrations]]
tag = "v1"
new_classes = ["WebSocketManager", "StateCoordinator", "RateLimiter", "JobScheduler"]

[[migrations]]
tag = "v2"
renamed_classes = [
  { from = "OldWebSocketManager", to = "WebSocketManager" }
]

# ============================================================================
# Fly.io Integration
# ============================================================================

[env.production.fly]
app_name = "katalyst-server"
regions = ["dfw", "ord", "iad", "lax", "fra"]
auto_scale = true
min_instances = 2
max_instances = 10

[env.staging.fly]
app_name = "katalyst-server-staging"
regions = ["dfw"]
auto_scale = false
min_instances = 1
max_instances = 2

# ============================================================================
# Development Settings
# ============================================================================

[miniflare]
kv_persist = "./.cloudflare/.mf/kv"
d1_persist = "./.cloudflare/.mf/d1"
r2_persist = "./.cloudflare/.mf/r2"
cache_persist = "./.cloudflare/.mf/cache"
durable_objects_persist = "./.cloudflare/.mf/do"
port = 8787
inspector_port = 9229