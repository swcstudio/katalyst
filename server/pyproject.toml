[project]
name = "katalyst-claude-integration"
version = "0.1.0"
description = "Python Claude Code SDK integration for Katalyst"
requires-python = ">=3.10"
dependencies = [
    "claude-code-sdk>=0.0.19",
    "anyio>=4.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"