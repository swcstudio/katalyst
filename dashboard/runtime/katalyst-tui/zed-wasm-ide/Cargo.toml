[package]
name = "zed-wasm-ide"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core WebAssembly support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Blob",
    "FileReader",
    "Performance",
    "RequestInit",
    "Request",
    "Response",
    "Headers",
    "ReadableStream",
    "WritableStream",
    "TransformStream",
] }

# Rustler for Elixir/Erlang interop
rustler = { version = "0.32", optional = true }

# IDE Core functionality
ropey = "1.6"  # Rope data structure for text editing
tree-sitter = "0.22"
tree-sitter-highlight = "0.22"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Async runtime
tokio = { version = "1.38", features = ["rt", "macros", "sync", "time"], default-features = false }
futures = "0.3"

# File handling & serialization
parquet = { version = "52.0", features = ["async"] }
arrow = { version = "52.0", features = ["prettyprint"] }
bytes = "1.6"

# Cryptobox integration
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1.7"

# Terminal emulation for IDE
portable-pty = { version = "0.8", optional = true }
vt100 = "0.15"
unicode-width = "0.1"

# Syntax highlighting & themes
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
once_cell = "1.19"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-wasm = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-timer = "0.2"
getrandom = { version = "0.2", features = ["js"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[features]
default = ["wasm"]
wasm = []
rustler-nif = ["rustler", "portable-pty"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
wasm-bindgen-test = "0.3"