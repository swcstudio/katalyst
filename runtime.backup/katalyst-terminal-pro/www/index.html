<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalyst Terminal Pro - WebAssembly</title>
    <style>
        :root {
            --bg-primary: #1c1c1c;
            --bg-secondary: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #00d4ff;
            --success: #95e454;
            --error: #ff6b6b;
            --warning: #ffa54f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--error);
            transition: background 0.3s;
        }

        .status-indicator.connected {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-indicator.connecting {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .toolbar {
            background: var(--bg-secondary);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .btn.primary:hover {
            background: #00a8cc;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            max-width: 400px;
        }

        .input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            flex: 1;
        }

        .input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
        }

        .terminal-container {
            flex: 1;
            display: flex;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: var(--bg-secondary);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s;
        }

        .sidebar.collapsed {
            margin-left: -250px;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            font-weight: bold;
            color: var(--text-secondary);
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 10px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .session-item.active {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .session-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .session-info {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .terminal-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .terminal-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        .terminal-tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .terminal-tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .terminal-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(0, 212, 255, 0.05);
        }

        #terminal-canvas {
            flex: 1;
            background: #0a0a0a;
            image-rendering: crisp-edges;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(28, 28, 28, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--error);
            padding: 10px 15px;
            border-radius: 4px;
            margin: 10px;
            font-size: 13px;
        }

        .stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(42, 42, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 11px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 5px;
        }

        .stats-row:last-child {
            margin-bottom: 0;
        }

        .stats-label {
            opacity: 0.7;
        }

        .stats-value {
            color: var(--accent);
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 100;
                height: 100%;
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            }

            .input-group {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
                Katalyst Terminal Pro
            </div>
            <div class="connection-status">
                <span class="status-indicator" id="status-indicator"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn" onclick="toggleSidebar()">☰ Sessions</button>
            <div class="input-group">
                <input type="text" class="input" id="repo-url" placeholder="Repository URL or path...">
                <button class="btn primary" onclick="createSession()">Create Session</button>
            </div>
            <button class="btn" onclick="connectToServer()">Connect</button>
            <button class="btn" onclick="showSettings()">⚙ Settings</button>
        </div>

        <div class="terminal-container">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">Active Sessions</div>
                <div class="session-list" id="session-list">
                    <!-- Sessions will be added here dynamically -->
                </div>
            </div>

            <div class="terminal-view">
                <div class="terminal-tabs" id="terminal-tabs">
                    <!-- Tabs will be added here dynamically -->
                </div>
                <canvas id="terminal-canvas"></canvas>
                
                <div class="loading-overlay" id="loading" style="display: none;">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Initializing terminal...</div>
                </div>

                <div class="stats" id="stats" style="display: none;">
                    <div class="stats-row">
                        <span class="stats-label">FPS:</span>
                        <span class="stats-value" id="fps">0</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">Latency:</span>
                        <span class="stats-value" id="latency">0ms</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">Sessions:</span>
                        <span class="stats-value" id="session-count">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import init, { 
            WasmTerminalBridge, 
            create_terminal, 
            version,
            render_terminal_frame 
        } from './pkg/katalyst_terminal_pro.js';

        let terminal = null;
        let currentSession = null;
        let connected = false;

        // Initialize WASM module
        async function initializeTerminal() {
            showLoading(true);
            
            try {
                await init();
                
                const config = {
                    server_url: localStorage.getItem('server_url') || 'wss://localhost:8080',
                    width: 1024,
                    height: 768,
                    theme: 'dark',
                    font_size: 14,
                    font_family: 'JetBrains Mono, monospace',
                    auto_reconnect: true,
                    reconnect_interval_ms: 5000
                };
                
                terminal = create_terminal(JSON.stringify(config));
                await terminal.initialize('terminal-canvas');
                
                // Set up event handlers
                terminal.on('connected', () => {
                    updateConnectionStatus('connected');
                    connected = true;
                });
                
                terminal.on('disconnected', () => {
                    updateConnectionStatus('disconnected');
                    connected = false;
                });
                
                terminal.on('error', (error) => {
                    console.error('Terminal error:', error);
                    showError(error);
                });
                
                terminal.on('session_created', (sessionId) => {
                    addSession(sessionId);
                });
                
                terminal.on('terminal_output', (data) => {
                    // Handle terminal output
                    console.log('Terminal output:', data);
                });
                
                console.log('Katalyst Terminal Pro v' + version());
                showLoading(false);
                
            } catch (error) {
                console.error('Failed to initialize terminal:', error);
                showError('Failed to initialize terminal: ' + error);
                showLoading(false);
            }
        }

        window.connectToServer = async function() {
            if (!terminal) {
                await initializeTerminal();
            }
            
            const serverUrl = prompt('Enter server URL:', 'wss://localhost:8080');
            if (serverUrl) {
                updateConnectionStatus('connecting');
                try {
                    await terminal.connect_to_server(serverUrl);
                    localStorage.setItem('server_url', serverUrl);
                } catch (error) {
                    console.error('Connection failed:', error);
                    showError('Failed to connect: ' + error);
                    updateConnectionStatus('disconnected');
                }
            }
        };

        window.createSession = async function() {
            const repoUrl = document.getElementById('repo-url').value;
            if (!repoUrl) {
                alert('Please enter a repository URL');
                return;
            }
            
            if (!connected) {
                await connectToServer();
            }
            
            try {
                const sessionId = await terminal.create_dev_session(repoUrl);
                console.log('Session created:', sessionId);
                addSession(sessionId, repoUrl);
            } catch (error) {
                console.error('Failed to create session:', error);
                showError('Failed to create session: ' + error);
            }
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        };

        window.showSettings = function() {
            // TODO: Implement settings dialog
            alert('Settings dialog coming soon!');
        };

        function updateConnectionStatus(status) {
            const indicator = document.getElementById('status-indicator');
            const text = document.getElementById('status-text');
            
            indicator.className = 'status-indicator ' + status;
            text.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.querySelector('.terminal-view').appendChild(errorDiv);
            
            setTimeout(() => errorDiv.remove(), 5000);
        }

        function addSession(sessionId, repoUrl = 'Unknown') {
            const sessionList = document.getElementById('session-list');
            
            const sessionItem = document.createElement('div');
            sessionItem.className = 'session-item';
            sessionItem.dataset.sessionId = sessionId;
            sessionItem.innerHTML = `
                <div class="session-name">${sessionId.substring(0, 8)}...</div>
                <div class="session-info">${repoUrl}</div>
            `;
            
            sessionItem.onclick = () => selectSession(sessionId);
            sessionList.appendChild(sessionItem);
            
            // Add tab
            const tabsContainer = document.getElementById('terminal-tabs');
            const tab = document.createElement('button');
            tab.className = 'terminal-tab';
            tab.dataset.sessionId = sessionId;
            tab.textContent = sessionId.substring(0, 8);
            tab.onclick = () => selectSession(sessionId);
            tabsContainer.appendChild(tab);
            
            // Auto-select if first session
            if (sessionList.children.length === 1) {
                selectSession(sessionId);
            }
            
            updateSessionCount();
        }

        function selectSession(sessionId) {
            currentSession = sessionId;
            
            // Update UI
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.toggle('active', item.dataset.sessionId === sessionId);
            });
            
            document.querySelectorAll('.terminal-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.sessionId === sessionId);
            });
            
            // TODO: Switch terminal view to selected session
            console.log('Selected session:', sessionId);
        }

        function updateSessionCount() {
            const count = document.querySelectorAll('.session-item').length;
            document.getElementById('session-count').textContent = count;
        }

        // Performance monitoring
        let frameCount = 0;
        let lastTime = performance.now();
        
        function updateStats() {
            frameCount++;
            const currentTime = performance.now();
            const delta = currentTime - lastTime;
            
            if (delta >= 1000) {
                const fps = Math.round((frameCount * 1000) / delta);
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            requestAnimationFrame(updateStats);
        }

        // Keyboard input handling
        document.addEventListener('keydown', (event) => {
            if (currentSession && terminal && connected) {
                // Send key to terminal
                terminal.send_input(currentSession, event.key);
            }
        });

        // Window resize handling
        window.addEventListener('resize', () => {
            if (terminal) {
                const canvas = document.getElementById('terminal-canvas');
                terminal.resize(canvas.clientWidth, canvas.clientHeight);
            }
        });

        // Initialize on load
        window.addEventListener('load', async () => {
            await initializeTerminal();
            updateStats();
            
            // Show stats in development
            if (window.location.hostname === 'localhost') {
                document.getElementById('stats').style.display = 'block';
            }
        });
    </script>
</body>
</html>
