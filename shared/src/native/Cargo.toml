[package]
name = "katalyst-multithreading"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js bindings
napi = { version = "3.1", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "3.1"

# Concurrency libraries
crossbeam = "0.8"
rayon = "1.8"
tokio = { version = "1.35", features = ["full"] }

# Additional utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.16"
futures = "0.3"

[build-dependencies]
napi-build = "2.2"
