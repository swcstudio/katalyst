apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: sota-marketing-stack-pipeline
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: git-url
      type: string
      description: URL of the git repository
    - name: git-revision
      type: string
      description: Git revision to checkout
      default: main
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "1"
    
    - name: lint
      taskRef:
        name: deno-lint
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-workspace
    
    - name: test
      taskRef:
        name: deno-test
      runAfter:
        - lint
      workspaces:
        - name: source
          workspace: shared-workspace
    
    - name: build
      taskRef:
        name: deno-build
      runAfter:
        - test
      workspaces:
        - name: source
          workspace: shared-workspace
    
    - name: deploy
      taskRef:
        name: deploy-to-netlify
      runAfter:
        - build
      workspaces:
        - name: source
          workspace: shared-workspace

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deno-lint
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: denoland/deno:1.32.0
      workingDir: $(workspaces.source.path)
      script: |
        deno task lint

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deno-test
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: denoland/deno:1.32.0
      workingDir: $(workspaces.source.path)
      script: |
        deno task test

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deno-build
spec:
  workspaces:
    - name: source
  steps:
    - name: build
      image: denoland/deno:1.32.0
      workingDir: $(workspaces.source.path)
      script: |
        deno task build

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-to-netlify
spec:
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: node:16
      workingDir: $(workspaces.source.path)
      script: |
        npm install -g netlify-cli
        netlify deploy --dir=dist --prod

