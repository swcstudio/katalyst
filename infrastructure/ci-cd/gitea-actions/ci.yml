name: AI-Powered CI
on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

jobs:
  nx-cloud:
    name: Nx Cloud CI
    runs-on: MIC_GITHUB_spectrumwebco
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.32.x

      - name: Cache Deno dependencies
        run: deno cache --reload --lock=deno.lock --lock-write server.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Nx Cloud CI
        run: npx nx-cloud start-ci-run

      - name: Run affected tasks with AI
        run: npx nx affected --target=build,test,lint --parallel=4 --cloud
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Stop Nx Cloud CI
        run: npx nx-cloud stop-all-agents
        if: always()

  deploy:
    name: Deploy
    needs: [nx-cloud]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: MIC_GITHUB_spectrumwebco
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.32.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all micro-frontends
        run: npx nx run-many --target=build --all --parallel=4
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v1.2
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from Gitea CI"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

