apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 5m
  chart:
    spec:
      chart: vault
      version: '0.23.x'
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    server:
      dev:
        enabled: false
      ha:
        enabled: true
        replicas: 3
      dataStorage:
        size: 10Gi
        storageClass: fast-ssd
      serviceAccount:
        create: true
      extraEnvironmentVars:
        VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
    ui:
      enabled: true
    injector:
      enabled: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: sota-marketing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: vault-auth
  namespace: sota-marketing
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-kubernetes-auth-setup
  namespace: vault
spec:
  template:
    spec:
      serviceAccountName: vault-auth
      containers:
      - name: vault-setup
        image: hashicorp/vault:1.13.0
        command:
        - /bin/sh
        - -c
        - |
          export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
          vault auth enable kubernetes
          vault write auth/kubernetes/config \
            kubernetes_host="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT" \
            token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            kubernetes_ca_cert="$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)" \
            issuer="https://kubernetes.default.svc.cluster.local"
          
          vault policy write sota-marketing - <<EOF
          path "secret/data/sota-marketing/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          EOF
          
          vault write auth/kubernetes/role/sota-marketing \
            bound_service_account_names=sota-marketing \
            bound_service_account_namespaces=sota-marketing \
            policies=sota-marketing \
            ttl=1h
      restartPolicy: Never
  backoffLimit: 3

