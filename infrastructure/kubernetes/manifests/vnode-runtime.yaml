apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: vnode-runtime
  namespace: sota-marketing
spec:
  chart: vnode-runtime
  repo: https://charts.loft.sh
  version: 0.0.2
  targetNamespace: sota-marketing
  valuesContent: |-
    image:
      repository: ghcr.io/loft-sh/vnode-runtime
      tag: "latest"
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    nodeSelector:
      kubernetes.io/arch: amd64
    tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300

