apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: convex-postgres
  namespace: sota-marketing
spec:
  instances: 3
  postgresql:
    parameters:
      max_connections: "200"
      shared_preload_libraries: "pg_stat_statements"
  storage:
    size: 10Gi
    storageClass: fast-ssd
  monitoring:
    enabled: true

---
apiVersion: v1
kind: Service
metadata:
  name: convex-postgres-rw
  namespace: sota-marketing
spec:
  selector:
    cnpg.io/cluster: convex-postgres
    role: primary
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convex-self-hosted
  namespace: sota-marketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: convex
  template:
    metadata:
      labels:
        app: convex
    spec:
      containers:
      - name: convex
        image: convex/server:latest
        env:
        - name: CONVEX_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: convex-secrets
              key: admin-password
        - name: CONVEX_DB_CONNECTION_STRING
          value: "postgresql://postgres:$(POSTGRES_PASSWORD)@convex-postgres-rw:5432/convex"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: convex-postgres-app
              key: password
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
