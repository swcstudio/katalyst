apiVersion: apps/v1
kind: Deployment
metadata:
  name: sota-marketing-stack
  namespace: sota-marketing
  labels:
    app: sota-marketing-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sota-marketing-stack
  template:
    metadata:
      labels:
        app: sota-marketing-stack
    spec:
      containers:
      - name: sota-marketing-stack
        image: sota-marketing-stack:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
      volumes:
      - name: config-volume
        configMap:
          name: sota-marketing-stack-config
---
apiVersion: v1
kind: Service
metadata:
  name: sota-marketing-stack
  namespace: sota-marketing
  labels:
    app: sota-marketing-stack
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: sota-marketing-stack
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sota-marketing-stack
  namespace: sota-marketing
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - marketing.spectrumwebco.com
    secretName: sota-marketing-tls
  rules:
  - host: marketing.spectrumwebco.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sota-marketing-stack
            port:
              name: http
