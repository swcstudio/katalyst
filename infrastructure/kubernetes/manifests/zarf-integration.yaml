apiVersion: v1
kind: Namespace
metadata:
  name: zarf-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zarf-config
  namespace: zarf-system
data:
  zarf.yaml: |
    kind: ZarfPackageConfig
    metadata:
      name: sota-marketing-stack
      version: "1.0.0"
      description: "SOTA Marketing Stack for air-gapped environments"
    components:
      - name: database
        description: "PostgreSQL database for Convex"
        images:
          - postgres:14-alpine
        manifests:
          - name: postgres
            namespace: sota-database
            files:
              - infrastructure/kubernetes/manifests/convex-postgres.yaml
      - name: marketing
        description: "Marketing micro-frontend"
        images:
          - nginx:alpine
        manifests:
          - name: marketing
            namespace: sota-marketing
            files:
              - infrastructure/kubernetes/manifests/marketing-deployment.yaml
      - name: blog
        description: "Blog micro-frontend"
        images:
          - nginx:alpine
        manifests:
          - name: blog
            namespace: sota-blog
            files:
              - infrastructure/kubernetes/manifests/blog-deployment.yaml
      - name: storefront
        description: "Storefront micro-frontend"
        images:
          - nginx:alpine
        manifests:
          - name: storefront
            namespace: sota-storefront
            files:
              - infrastructure/kubernetes/manifests/storefront-deployment.yaml
      - name: docs
        description: "Documentation micro-frontend"
        images:
          - nginx:alpine
        manifests:
          - name: docs
            namespace: sota-docs
            files:
              - infrastructure/kubernetes/manifests/docs-deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zarf-agent
  namespace: zarf-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zarf-agent
  template:
    metadata:
      labels:
        app: zarf-agent
    spec:
      containers:
      - name: zarf-agent
        image: ghcr.io/zarf-dev/zarf:v0.28.0
        command: ["zarf", "agent"]
        env:
        - name: ZARF_CONFIG
          value: /etc/zarf/zarf.yaml
        volumeMounts:
        - name: zarf-config
          mountPath: /etc/zarf
      volumes:
      - name: zarf-config
        configMap:
          name: zarf-config

