apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '45.x'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    grafana:
      enabled: true
      adminPassword: "prom-operator"
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - grafana.sota-marketing.local
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.sota-marketing.local
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki-gateway.monitoring.svc.cluster.local
        - name: Thanos
          type: prometheus
          url: http://thanos-query-frontend.monitoring.svc.cluster.local:9090
    prometheus:
      prometheusSpec:
        retention: 2d
        thanos:
          image: quay.io/thanos/thanos:v0.30.2
          version: v0.30.2
          objectStorageConfig:
            name: thanos-objstore-config
            key: objstore.yml
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: thanos
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: thanos
      version: '12.x'
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    query:
      enabled: true
      replicaCount: 2
    queryFrontend:
      enabled: true
      replicaCount: 2
    storegateway:
      enabled: true
      replicaCount: 2
    compactor:
      enabled: true
      retentionResolution1h: 5y
      retentionResolution5m: 1y
      retentionResolution1m: 7d
    ruler:
      enabled: true
      replicaCount: 2
    receive:
      enabled: true
      replicaCount: 2
    bucketweb:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: loki-stack
      version: '2.9.x'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    loki:
      enabled: true
      isDefault: true
      persistence:
        enabled: true
        size: 10Gi
      config:
        auth_enabled: false
        storage_config:
          boltdb_shipper:
            active_index_directory: /data/loki/index
            cache_location: /data/loki/index_cache
            cache_ttl: 24h
            shared_store: s3
          aws:
            s3: s3://access_key:secret_key@endpoint/bucket_name
    promtail:
      enabled: true
      config:
        lokiAddress: http://loki-stack:3100/loki/api/v1/push
    fluent-bit:
      enabled: false
    grafana:
      enabled: false
    prometheus:
      enabled: false

