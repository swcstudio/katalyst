name: Katalyst CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
    paths: [ 'katalyst/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'katalyst/**' ]

jobs:
  test-katalyst:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [core, remix, nextjs]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.40.x
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.70.0
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.deno
          ~/.cargo
          target/
        key: ${{ runner.os }}-katalyst-${{ matrix.variant }}-${{ hashFiles('katalyst/${{ matrix.variant }}/deno.json') }}
    
    - name: Lint Katalyst ${{ matrix.variant }}
      run: deno lint katalyst/${{ matrix.variant }}/
    
    - name: Format check Katalyst ${{ matrix.variant }}
      run: deno fmt --check katalyst/${{ matrix.variant }}/
    
    - name: Test Katalyst ${{ matrix.variant }}
      run: deno test --allow-all katalyst/${{ matrix.variant }}/tests/
    
    - name: Build Katalyst ${{ matrix.variant }}
      run: deno task build:katalyst-${{ matrix.variant }}

  deploy-vercel:
    needs: test-katalyst
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        variant: [core, remix, nextjs]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.40.x
    
    - name: Build Katalyst ${{ matrix.variant }}
      run: deno task build:katalyst-${{ matrix.variant }}
    
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_KATALYST_${{ matrix.variant | upper }} }}
        working-directory: ./katalyst/${{ matrix.variant }}
        vercel-args: '--prod'
