name: Build Native Multithreading Binaries

on:
  push:
    paths:
      - 'packages/multithreading/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'packages/multithreading/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  DEBUG: napi:*
  APP_NAME: swcstudio-multithreading
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build --target aarch64-apple-darwin
          - host: windows-latest
            build: npm run build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            build: npm run build --target i686-pc-windows-msvc
            target: i686-pc-windows-msvc
          - host: windows-latest
            build: npm run build --target aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: npm run build --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: npm run build --target x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            build: npm run build --target aarch64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine-aarch64
            build: npm run build --target aarch64-unknown-linux-musl
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            setup: |
              sudo apt-get update
              sudo apt-get install gcc-arm-linux-gnueabihf -y
            build: npm run build --target armv7-unknown-linux-gnueabihf

    name: stable - ${{ matrix.settings.target }} - node@18
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: packages/multithreading/package-lock.json

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        working-directory: packages/multithreading
        run: npm ci --ignore-scripts

      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          version: 0.10.1

      - name: Build in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}/.cargo-cache:/root/.cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/root/.cargo/registry/index -v ${{ github.workspace }}:/build -w /build/packages/multithreading'
          run: ${{ matrix.settings.build }}

      - name: Build
        working-directory: packages/multithreading
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.settings.target }}
          path: packages/multithreading/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-macOS-windows-binding:
    name: Test binaries on ${{ matrix.settings.host }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: packages/multithreading/package-lock.json

      - name: Install dependencies
        working-directory: packages/multithreading
        run: npm ci --ignore-scripts

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: binaries-${{ matrix.settings.target }}
          path: packages/multithreading

      - name: List packages
        run: ls -la packages/multithreading
        shell: bash

      - name: Test binding
        working-directory: packages/multithreading
        run: npm test

  test-linux-x64-gnu-binding:
    name: Test binaries on Linux-x64-gnu
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: packages/multithreading/package-lock.json

      - name: Install dependencies
        working-directory: packages/multithreading
        run: npm ci --ignore-scripts

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: packages/multithreading

      - name: List packages
        run: ls -la packages/multithreading
        shell: bash

      - name: Test binding
        working-directory: packages/multithreading
        run: docker run --rm -v $(pwd):/build -w /build node:18-slim npm test

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs:
      - test-macOS-windows-binding
      - test-linux-x64-gnu-binding
    if: github.event_name == 'release'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: packages/multithreading/package-lock.json

      - name: Install dependencies
        working-directory: packages/multithreading
        run: npm ci --ignore-scripts

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: packages/multithreading/artifacts

      - name: Move artifacts
        working-directory: packages/multithreading
        run: npm run artifacts

      - name: List packages
        run: ls -la packages/multithreading
        shell: bash

      - name: Publish
        working-directory: packages/multithreading
        run: |
          npm config set provenance true
          if git log -1 --pretty=%B | grep "^[0-9]\+\.[0-9]\+.*$";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
