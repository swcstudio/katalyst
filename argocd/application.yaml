apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sota-marketing-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/spectrumwebco/sota-marketing-stack.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sota-marketing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

