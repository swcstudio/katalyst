[package]
name = "katalyst-terminal-pro"
version = "0.1.0"
edition = "2021"
authors = ["Katalyst Team"]
license = "MIT OR Apache-2.0"

[dependencies]
# Core Terminal Components
zellij-client = "0.40"
zellij-server = "0.40"
zellij-utils = "0.40"
zellij-tile = "0.40"

# Helix Editor Integration
helix-core = "24.3"
helix-view = "24.3"
helix-term = "24.3"
helix-lsp = "24.3"
helix-loader = "24.3"
helix-dap = "24.3"

# DevContainer Support
bollard = "0.16"  # Docker API client
containerd-client = "0.5"
oci-spec = "0.6"
containers-api = "0.10"

# WebAssembly
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
wasmer.workspace = true
wasmer-wasix.workspace = true
wasmtime.workspace = true

# Redox OS Support
redox_syscall = "0.5"
redox_termios = "0.1"

# Terminal & PTY
portable-pty.workspace = true
vt100 = "0.15"
vte = "0.13"
termwiz = "0.22"
crossterm = "0.28"

# Async Runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"

# Networking
tokio-tungstenite = "0.24"
tungstenite = "0.24"
reqwest = { version = "0.12", features = ["json", "stream"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "compression", "trace"] }
axum = "0.7"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml.workspace = true
bincode = "1.3"

# Configuration
config.workspace = true
directories.workspace = true

# Error Handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# File System
notify.workspace = true
walkdir = "2.5"
ignore = "0.4"
tempfile = "3.12"

# Process Management
nix = { version = "0.29", features = ["process", "signal", "term", "user"] }
libc = "0.2"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Security
rustls = "0.23"
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
ring.workspace = true
ed25519-dalek = "2.1"

# Performance
parking_lot.workspace = true
dashmap.workspace = true
rayon.workspace = true
crossbeam = "0.8"
arc-swap = "1.7"

# UI Components
ratatui.workspace = true
tui-textarea = "0.6"
unicode-width = "0.1"
unicode-segmentation = "1.11"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell.workspace = true
indexmap = "2.5"
smallvec = "1.13"
bytes = "1.7"
base64 = "0.22"

# Claude Integration
katalyst-claude = { path = "../katalyst-claude" }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Storage",
    "Console",
]}
console_error_panic_hook = "0.1"
wee_alloc = "0.4"

[features]
default = ["gpu-acceleration", "devcontainer", "remote-development"]
gpu-acceleration = []
devcontainer = ["bollard", "oci-spec"]
remote-development = []
redox-native = ["redox_syscall", "redox_termios"]
wasm = ["wasm-bindgen", "web-sys", "js-sys"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# WebAssembly specific optimizations
[profile.wasm]
inherits = "release"
opt-level = "z"  # Optimize for size
lto = true
panic = "abort"

[[bin]]
name = "katalyst-terminal"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]