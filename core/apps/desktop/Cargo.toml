[package]
name = "katalyst-desktop"
version = "0.1.0"
description = "Katalyst Desktop Application - Built with Tauri 2.0"
authors = ["Katalyst Team"]
license = "MIT"
repository = "https://github.com/katalyst/desktop"
edition = "2021"

# Prevent a cargo panic due to duplicate crates when building more than one custom runtime
[lib]
name = "katalyst_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-deep-link = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.4"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
anyhow = "1.0"

# Katalyst specific dependencies
katalyst-core = { path = "../../packages/core" }
swcstudio-multithreading = { path = "../../packages/multithreading" }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
ayatana = ["tauri/ayatana-tray"]

[[bin]]
name = "katalyst-desktop"
path = "src/main.rs"
