# Prometheus configuration for Katalyst Server monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'katalyst-dev'
    replica: 'prometheus-1'

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Katalyst Phoenix application metrics
  - job_name: 'katalyst-phoenix'
    static_configs:
      - targets: ['katalyst:9091']
    scrape_interval: 10s
    metrics_path: '/metrics'
    scrape_timeout: 5s
    honor_labels: true
    params:
      'format': ['prometheus']

  # Katalyst health endpoint
  - job_name: 'katalyst-health'
    static_configs:
      - targets: ['katalyst:8080']
    metrics_path: '/health'
    scrape_interval: 30s

  # Claude Code API metrics
  - job_name: 'katalyst-claude'
    static_configs:
      - targets: ['katalyst:8080']
    metrics_path: '/api/claude/metrics'
    scrape_interval: 15s

  # PostgreSQL metrics (if available)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Node.js/Miniflare metrics
  - job_name: 'miniflare'
    static_configs:
      - targets: ['miniflare:8787']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

