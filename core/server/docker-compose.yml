version: '3.9'

services:
  # Katalyst Phoenix Application with Python + Claude Code + Cloudflare integration
  katalyst:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: katalyst-app
    environment:
      # Phoenix/Elixir
      MIX_ENV: dev
      PORT: 4000
      PHX_HOST: localhost
      PHX_SERVER: "true"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-$(mix phx.gen.secret)}"
      
      # Python/Claude Code Integration
      PYTHON_ENV: development
      PYTHONPATH: "/app/.venv/lib/python3.12/site-packages"
      VIRTUAL_ENV: "/app/.venv"
      CLAUDE_SDK_ENV: development
      CLAUDE_MAX_SESSIONS: "100"
      CLAUDE_SESSION_TIMEOUT: "3600"
      CLAUDE_API_KEY: "${CLAUDE_API_KEY}"
      
      # Rust Configuration
      RUST_ENV: development
      RUST_BACKTRACE: "1"
      
      # Performance tuning for development
      NODE_POOL_SIZE: "20"
      GENSERVER_POOL_SIZE: "10"
      MAX_CONCURRENT_REQUESTS: "1000"
      
      # Cloudflare configuration
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN}"
      CLOUDFLARE_ZONE_ID: "${CLOUDFLARE_ZONE_ID}"
      
      # Use Cloudflare services in hybrid mode
      USE_CLOUDFLARE_D1: "true"
      USE_CLOUDFLARE_KV: "true"
      USE_CLOUDFLARE_QUEUES: "true"
      USE_CLOUDFLARE_VECTORIZE: "true"
      USE_CLOUDFLARE_AI: "true"
      
      # WASM/Deno configuration
      DENO_DIR: "/app/.deno"
      RUST_WASM_TARGET: "wasm32-unknown-unknown"
      
      # Database configuration
      DATABASE_URL: "postgres://katalyst:katalyst@postgres:5432/katalyst_dev"
      REDIS_URL: "redis://redis:6379/0"
      
    ports:
      - "4000:4000"   # Phoenix server
      - "4001:4001"   # LiveDashboard
      - "8080:8080"   # Production API port
      - "9091:9091"   # Metrics
    volumes:
      # Enable hot reloading for development
      - .:/app:cached
      - build_cache:/app/_build
      - deps_cache:/app/deps
      - cargo_cache:/root/.cargo
      - deno_cache:/app/.deno
      - python_cache:/app/.venv
      - cloudflare_cache:/app/.cloudflare/.mf
      
      # Persistent data
      - katalyst_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      miniflare:
        condition: service_started
    command: |
      sh -c "
        echo '🔧 Setting up Katalyst development environment...' &&
        echo '📦 Installing Python dependencies...' &&
        . .venv/bin/activate &&
        echo '🧰 Installing Elixir dependencies...' &&
        mix deps.get &&
        echo '🔨 Compiling application...' &&
        mix compile &&
        echo '🚀 Starting Phoenix server with Claude Code integration...' &&
        mix phx.server
      "
    restart: unless-stopped
    networks:
      - katalyst-network

  # Local PostgreSQL for development only
  # In production, use Cloudflare D1 or Hyperdrive
  postgres:
    image: postgres:16-alpine
    container_name: katalyst-postgres-dev
    environment:
      POSTGRES_DB: katalyst_dev
      POSTGRES_USER: katalyst
      POSTGRES_PASSWORD: katalyst
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./priv/repo/seeds.sql:/docker-entrypoint-initdb.d/seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katalyst -d katalyst_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - katalyst-network

  # Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: katalyst-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - katalyst-network
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # Miniflare - Local Cloudflare Workers development
  miniflare:
    image: node:20-alpine
    container_name: katalyst-miniflare
    working_dir: /app
    environment:
      NODE_ENV: development
    ports:
      - "8787:8787" # Workers
      - "8788:8788" # Inspector
      - "6284:6284" # Miniflare API
    volumes:
      - ./.cloudflare:/app
      - miniflare_data:/app/.mf
    command: |
      sh -c "
        npm install -g wrangler miniflare &&
        npx miniflare --watch --debug --port 8787 --inspector-port 8788
      "
    networks:
      - katalyst-network

  # Cloudflared tunnel for local development with Cloudflare services
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: katalyst-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    restart: unless-stopped
    networks:
      - katalyst-network

  # Optional: Local AI model server for development
  # In production, use Cloudflare AI Workers
  ollama:
    image: ollama/ollama:latest
    container_name: katalyst-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - katalyst-network

  # Monitoring services for development
  prometheus:
    image: prom/prometheus:latest
    container_name: katalyst-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - katalyst-network

  grafana:
    image: grafana/grafana:latest
    container_name: katalyst-grafana-dev
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: katalyst
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - katalyst-network

volumes:
  postgres_data:
  redis_data:
  build_cache:
  deps_cache:
  cargo_cache:
  deno_cache:
  python_cache:
  cloudflare_cache:
  miniflare_data:
  ollama_data:
  katalyst_data:
  prometheus_data:
  grafana_data:

networks:
  katalyst-network:
    driver: bridge