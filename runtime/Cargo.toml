[workspace]
resolver = "2"
members = [
    "katalyst-tui",
    "katalyst-core",
    "katalyst-lsp",
    "katalyst-wasm-runtime",
    "katalyst-desktop",
    "katalyst-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Katalyst Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/katalyst/katalyst-wasm"

[workspace.dependencies]
# TUI Framework
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.6"
tui-tree-widget = "0.22"
tui-scrollview = "0.4"
tui-logger = "0.12"

# Terminal multiplexing
termwiz = "0.22"
portable-pty = "0.8"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# WebAssembly
wasmer = "4.3"
wasmer-wasix = "0.25"
wasmtime = "24.0"

# Language servers
tower-lsp = "0.20"
lsp-types = "0.97"
lsp-server = "0.7"

# Tauri for desktop
tauri = "2.0.0-rc"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"

# File watching
notify = "6.1"
notify-debouncer-full = "0.3"

# Networking
reqwest = { version = "0.12", features = ["json"] }
tungstenite = "0.24"

# System
sysinfo = "0.31"
which = "6.0"

# Syntax highlighting
tree-sitter = "0.23"
tree-sitter-highlight = "0.23"

# Search
tantivy = "0.22"
meilisearch-sdk = "0.27"
skim = "0.10"

# Push notifications
notify-rust = "4.11"
winrt-notification = "0.5"

# Process management
nix = { version = "0.29", features = ["process", "signal", "term"] }

# Configuration
config = "0.14"
directories = "5.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# Cryptography
ring = "0.17"

# Compression
flate2 = "1.0"
zstd = "0.13"